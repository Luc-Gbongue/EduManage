<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale=1.0">
        <title>EduManage - Inscription</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body class="register">
        <!-- En-tête de la page -->
        <header class="register-header">
            <!-- logo -->
            <div class="logo"><span>E</span>duManage</div>

            <!-- barre de navigation/lien  -->
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="login.html">Se connecter</a></li>
                </ul>
            </nav>
        </header>

        <!-- Menu principal -->
        <main class="register-main">
            <div class="register-container">
                <div class="register-content">
                    <h1>Créer un compte</h1>
                    <p>Inscrivez-vous pour avoir votre espace de travail sur EduManage</p>
                </div>
                <form action="#" method="POST">
                    <div class="name-box">
                        <label for="firstname">Nom : </label>
                        <input type="text" name="firstname" id="firstname" placeholder="Entrez votre nom de famille" required>
                    </div>
                    <div class="input-box">
                        <label for="lastname">Prénom(s) : </label>
                        <input type="text" name="lastname" id="lastname" placeholder="Entrez votre prénom" required>
                    </div>
                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Entrez votre adresse mail" required>
                    </div>
                    <div class="input-box">
                        <label for="password">Mot de passe</label>
                        <input type="password" name="password" id="password" placeholder="Entrez votre mot de passe" required>
                    </div>
                    <div class="input-box">
                        <label for="confirmpassword">Confirmer le mot de passe</label>
                        <input type="confirmpassword" name="confirmpassword" id="confirmpassword" placeholder="Confirmez votre mot de passe" required>
                    </div>
                </form>
            </div>
        </main>

        <!-- Pieds de page -->
        <footer class="register-footer">
            <p>&copy; 2026 EduManage - Tous droits reservés. </p>
        </footer>
        
    </body>
</html>
